name: Build Resume PDF

on:
  push:
    branches: [main]
    paths:
      - 'Aushikar_Ganesh_Resume.tex'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Aushikar_Ganesh_Resume.tex

      - name: Rename PDF
        run: cp Aushikar_Ganesh_Resume.pdf Aushikar_Ganesh_Resume.pdf || true

      - name: Commit Updated PDF
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Aushikar_Ganesh_Resume.pdf
          git diff --cached --quiet || (
            git commit -m "Auto update resume PDF"
            git push
          )
