name: Build Resume PDF

on:
  push:
    paths:
      - 'resume/*.tex'
      - 'index.html'
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← forces Node 24 per GitHub's guidance

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5             # ← v5 is the first version using Node 24

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3        # Docker action — unaffected, leave as is
        with:
          root_file: resume.tex
          working_directory: resume

      - name: Replace PDF
        run: |
          cp resume/resume.pdf Aushikar_Ganesh_Resume.pdf

      - name: Commit Updated PDF
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add Aushikar_Ganesh_Resume.pdf
          git diff --cached --quiet || (
            git commit -m "Auto update resume PDF"
            git push
          )
